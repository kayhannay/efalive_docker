[tool.poetry]
name = "create_release"
version = "0.1.0"
description = "Tool that creates releases and changelog based on commits"
authors = ["Kay Hannay <klinux@hannay.de>"]

[tool.poetry.dependencies]
python = "^3.12"
click = "^8.5.0"
gitpython = "^3.1.61"

[tool.poetry.dev-dependencies]
pytest = "^9.1.1"
pylint = "^4.0.8"
pytest-mock = "^3.15.1"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry>=2.4.0"]
build-backend = "poetry.masonry.api"
